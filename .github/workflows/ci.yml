name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # -------------------------------------------------------------------------
  # PR bloklayıcı aşama — §1 §9.1 hedefi: < 15 dk
  # -------------------------------------------------------------------------
  gates:
    name: kapılar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml sürümü sabitliyor; ayrıca kurmaya gerek yok.
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # §1 karar #15: argus-core I/O yapmaz. Faz 0 çıkış kriteri.
      # Lint ile ifade edilemiyor, bu yüzden grep kapısı.
      - name: argus-core I/O sızıntısı
        run: |
          if grep -rnE 'async fn|tokio::|sqlx::|reqwest::|std::fs|std::net' crates/argus-core/src/; then
            echo "::error::argus-core I/O içeriyor — §1 karar #15"
            exit 1
          fi

      # Faz 0 çıkış kriteri: unsafe denetimi. `cargo geiger --forbid-only` bir
      # rapor aracıdır ve "yeşil"in ne demek olduğunu tanımlamaz; bu script
      # Argus'un tanımını zorlar (izinli iki crate + gerekçe yorumu şartı).
      - name: unsafe denetimi
        run: ./scripts/unsafe-audit.sh

      # CLAUDE.md §6: yorumlar Türkçe, kodda Türkçe yok.
      - name: kodda Türkçe karakter
        run: |
          if find crates -name '*.rs' -exec sed 's://.*::' {} + | grep -n '[ğüşıöçĞÜŞİÖÇ]'; then
            echo "::error::kod (yorum dışı) Türkçe karakter içeriyor"
            exit 1
          fi

  test:
    name: test (shard ${{ matrix.partition }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: nextest
        run: cargo nextest run --profile ci --partition count:${{ matrix.partition }}/4
      - name: doctest
        if: matrix.partition == 1
        run: cargo test --doc

  # -------------------------------------------------------------------------
  # Şema ve RLS — Faz 0 çıkış kriteri
  # -------------------------------------------------------------------------
  schema:
    name: şema + RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: argus
          POSTGRES_DB: argus
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: psql kur
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: migration
        env: { PGPASSWORD: argus }
        run: |
          for f in crates/argus-store/migrations/*.sql; do
            echo "--- $f"
            psql -h localhost -U postgres -d argus -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: RLS testleri
        env: { PGPASSWORD: argus }
        run: psql -h localhost -U postgres -d argus -v ON_ERROR_STOP=1 -q -f crates/argus-store/tests/rls_isolation.sql

  # -------------------------------------------------------------------------
  # Tedarik zinciri — §12
  # -------------------------------------------------------------------------
  supply-chain:
    name: tedarik zinciri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      # Faz 0 çıkış kriteri: cargo geiger --forbid-only yeşil.
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-geiger }
      # Bilgi amaçlı: ağaçtaki unsafe kullanımının haritası. Kapı yukarıdaki
      # scripttir; geiger yalnızca üçüncü taraf bağımlılıklardaki durumu raporlar.
      - name: geiger (forbid-only)
        run: cargo geiger --forbid-only
        continue-on-error: true

      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      - name: deny (bans licenses sources advisories)
        run: cargo deny check
