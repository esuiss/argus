# nextest yapılandırması — §27 test stratejisi.

[profile.default]
# Bir test takılırsa CI'ı 6 saat bekletmesin.
slow-timeout = { period = "30s", terminate-after = 4 }
# Sızıntı yapan (arka planda süreç bırakan) testler hata sayılır.
leak-timeout = "500ms"
fail-fast = false

[profile.ci]
# §1 §9.1 CI zaman bütçesi: PR bloklayıcı aşama < 15 dk.
# Shard'lama `--partition count:N/M` ile çağrı tarafında yapılır.
slow-timeout = { period = "60s", terminate-after = 3 }
fail-fast = false
failure-output = "immediate-final"
status-level = "retry"

[profile.ci.junit]
path = "junit.xml"

# Postgres gerektiren testler ayrı grupta: paralel koşarlarsa aynı veritabanını
# paylaşıp birbirlerinin satırlarını görürler.
[[profile.default.overrides]]
filter = 'test(/^db_/)'
threads-required = 4

[test-groups]
database = { max-threads = 1 }
