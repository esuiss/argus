[workspace]
resolver = "3"
members = [
    "crates/argus-core",
    "crates/argus-proto",
    "crates/argus-parse",
    "crates/argus-crypto",
    "crates/argus-store",
    "crates/argus-http",
    "crates/argus-sandbox",
    "crates/argus-saml",
    "crates/argus",
]

[workspace.package]
version      = "0.0.0"
edition      = "2024"
rust-version = "1.98"
license      = "AGPL-3.0-only"
repository   = "https://github.com/esuiss/argus"

[workspace.lints.rust]
unsafe_code                = "forbid"
unreachable_pub            = "warn"
rust_2018_idioms           = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all                        = { level = "warn", priority = -1 }
pedantic                   = { level = "warn", priority = -1 }
unwrap_used                = "deny"
expect_used                = "deny"
panic                      = "deny"
indexing_slicing           = "deny"
integer_division           = "deny"
cast_possible_truncation   = "deny"
cast_sign_loss             = "deny"
module_name_repetitions    = "allow"

[workspace.dependencies]
thiserror = "2"

# §1 §2.2'deki listede yoktu — gerekçe (CLAUDE.md §6 kuralı):
# Kimlik tipleri için zorunlu. Birincil anahtarlar UUIDv7 (§1 §2, PG18 yerleşik
# `uuidv7()`), dolayısıyla Rust tarafında yalnızca TAŞIMA ve AYRIŞTIRMA gerekiyor —
# üretim veritabanında. Bu yüzden `v4`/`v7` özellikleri KAPALI: argus-core'un
# rastgelelik kaynağına erişmesi gerekmiyor. Lisans: MIT OR Apache-2.0 (AGPL uyumlu).
uuid = { version = "1", default-features = false }

# §1 §2.2'deki listede yoktu — gerekçe (CLAUDE.md §6 kuralı):
# `redirect_uri` eşleştirmesi (§1 #24) exact string'dir, TEK istisnası loopback'te
# port'un yok sayılmasıdır (RFC 8252 §7.3). Port'u yok saymak için URL'yi ayrıştırmak
# zorunlu; elle ayrıştırma tam olarak authentik CVE-2024-52289'un sınıfıdır.
# WHATWG URL uygulaması, ağ erişimi yok. Lisans: MIT OR Apache-2.0 (AGPL uyumlu).
url = "2"

# Yalnızca dev-dependency (§27 test stratejisi: "insta snapshot altyapısı").
# Üretim binary'sine girmez. Lisans: Apache-2.0.
insta = "1"

# §1 §2.2 listesinde yoktu — gerekçe (CLAUDE.md kuralı):
# PKCE doğrulaması (RFC 7636 §4.6) sabit zamanlı karşılaştırma ister. §8 §5254:
# "RFC 7636 sabit zaman ZORUNLU KILMIYOR ... ama maliyeti sıfır olduğundan yine de
# yapın." Elle yazılmış bir CT karşılaştırma derleyici tarafından optimize edilip
# kaldırılabilir; `subtle` tam olarak bunu engellemek için var. Saf hesaplama,
# I/O yok. Lisans: BSD-3-Clause.
subtle = { version = "2", default-features = false }

# `code_challenge` BASE64URL kodludur; karşılaştırma için çözmek gerekiyor.
# `base64ct` sabit zamanlı ve no_std — RustCrypto'nun bu iş için yazdığı crate.
# Saf hesaplama. Lisans: Apache-2.0 OR MIT.
base64ct = { version = "1", default-features = false }
