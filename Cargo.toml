[workspace]
resolver = "3"
members = [
    "crates/argus-core",
    "crates/argus-proto",
    "crates/argus-parse",
    "crates/argus-crypto",
    "crates/argus-store",
    "crates/argus-http",
    "crates/argus-sandbox",
    "crates/argus-saml",
    "crates/argus-ldap",
    "crates/argus",
]

[workspace.package]
version      = "0.0.0"
edition      = "2024"
rust-version = "1.98"
license      = "AGPL-3.0-only"
repository   = "https://github.com/esuiss/argus"

[workspace.lints.rust]
unsafe_code                = "forbid"
unreachable_pub            = "warn"
rust_2018_idioms           = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all                        = { level = "warn", priority = -1 }
pedantic                   = { level = "warn", priority = -1 }
unwrap_used                = "deny"
expect_used                = "deny"
panic                      = "deny"
indexing_slicing           = "deny"
integer_division           = "deny"
cast_possible_truncation   = "deny"
cast_sign_loss             = "deny"
module_name_repetitions    = "allow"

# Bu iki lint doküman yorumunda `# Errors` / `# Panics` bölümü ister; projede
# yorum tutulmuyor, dolayısıyla zorlanacak bir sözleşme yok.
missing_errors_doc         = "allow"
missing_panics_doc         = "allow"

[workspace.dependencies]
thiserror = "2"

# §1 §2.2 listesinde yoktu — gerekçe (CLAUDE.md §6 kuralı):
# §16 §1.13.4 seçenek (B): exc-c14n + XMLDSig'in zor ve tehlikeli kısmı devredilir,
# SAML alan modeli (Response/Assertion/NameID/attribute release) kendimiz yazılır.
# Sıfırdan c14n yazmak §16'da açıkça yasaklandı: document-subset/node-set
# semantiğindeki bir hata doğrudan XSW'ye açık bir doğrulayıcı üretir.
# Saf Rust, C bağımlılığı yok. Lisans: BSD-2-Clause (AGPL uyumlu).
# İmzalama/doğrulama tek bir trait arkasında; crate beklentiyi karşılamazsa
# değişiklik tek modülle sınırlı kalır.
bergshamra      = "0.9"
bergshamra-c14n = "0.9"
bergshamra-xml  = "0.9"
quick-xml       = { version = "0.38", default-features = false }
uppsala         = "0.10"

# §1 §2.2'deki listede yoktu — gerekçe (CLAUDE.md §6 kuralı):
# Kimlik tipleri için zorunlu. Birincil anahtarlar UUIDv7 (§1 §2, PG18 yerleşik
# `uuidv7()`), dolayısıyla Rust tarafında yalnızca TAŞIMA ve AYRIŞTIRMA gerekiyor —
# üretim veritabanında. Bu yüzden `v4`/`v7` özellikleri KAPALI: argus-core'un
# rastgelelik kaynağına erişmesi gerekmiyor. Lisans: MIT OR Apache-2.0 (AGPL uyumlu).
uuid = { version = "1", default-features = false, features = ["v4"] }

# §1 §2.2'deki listede yoktu — gerekçe (CLAUDE.md §6 kuralı):
# `redirect_uri` eşleştirmesi (§1 #24) exact string'dir, TEK istisnası loopback'te
# port'un yok sayılmasıdır (RFC 8252 §7.3). Port'u yok saymak için URL'yi ayrıştırmak
# zorunlu; elle ayrıştırma tam olarak authentik CVE-2024-52289'un sınıfıdır.
# WHATWG URL uygulaması, ağ erişimi yok. Lisans: MIT OR Apache-2.0 (AGPL uyumlu).
url = "2"

# Yalnızca dev-dependency (§9 Faz 3 çıkış kriteri: "criterion Argon2 regresyon
# eşiği"). Üretim binary'sine girmez. Lisans: MIT OR Apache-2.0.
criterion = { version = "0.5", default-features = false }

# Yalnızca dev-dependency (§27 test stratejisi: "insta snapshot altyapısı").
# Üretim binary'sine girmez. Lisans: Apache-2.0.
insta = "1"

# §1 §2.2 listesinde yoktu — gerekçe (CLAUDE.md kuralı):
# PKCE doğrulaması (RFC 7636 §4.6) sabit zamanlı karşılaştırma ister. §8 §5254:
# "RFC 7636 sabit zaman ZORUNLU KILMIYOR ... ama maliyeti sıfır olduğundan yine de
# yapın." Elle yazılmış bir CT karşılaştırma derleyici tarafından optimize edilip
# kaldırılabilir; `subtle` tam olarak bunu engellemek için var. Saf hesaplama,
# I/O yok. Lisans: BSD-3-Clause.
subtle = { version = "2", default-features = false }

# `code_challenge` BASE64URL kodludur; karşılaştırma için çözmek gerekiyor.
# `base64ct` sabit zamanlı ve no_std — RustCrypto'nun bu iş için yazdığı crate.
# Saf hesaplama. Lisans: Apache-2.0 OR MIT.
# `alloc`: `argus-proto` JWK koordinatlarını dizgeye kodluyor. `argus-core` yalnızca
# sabit tampona çözüyor ve tahsis yapmıyor.
base64ct = { version = "1", default-features = false, features = ["alloc"] }

# §1 §2.2 kararı: kripto sağlayıcı aws-lc-rs. §7: RS256 için doğrulanmış
# implementasyon yok, `rsa` crate'i Marvin'e (RUSTSEC-2023-0071) hâlâ açık.
# aws-lc-rs FIPS moduna hazır ve s2n-bignum'un makine-kontrollü ispatlarını taşır.
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "ring-io"] }

# Tel formatı. `argus-proto` protokol tiplerini serde ile taşır; `argus-core`
# bunlara bağımlı DEĞİLDİR (karar mantığı serde bilmez).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# §1 §2.2 satır 396'da onaylı: rustls. Sunucu tarafı TLS sonlandırma için.
# `aws-lc-rs` sağlayıcısı seçildi (§1 §2.2 kripto kararıyla aynı) — `ring` ile iki
# ayrı kripto yığını taşımamak için sqlx de aws-lc-rs'e alındı.
# rustls kendi ifadesiyle güven sınırındaki tüm crate'inde `forbid(unsafe_code)`.
# Lisans: Apache-2.0 OR ISC OR MIT (AGPL uyumlu).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "tls12", "logging"] }

# rustls ekibinin tokio adaptörü ve PEM ayrıştırıcısı. Üçüncü taraf sarmalayıcı
# (axum-server gibi) yerine bunlar seçildi: kabul döngüsünü kendimiz yazınca
# graceful shutdown yolu açıkta kalıyor ve §9.5 #3'ün "in-flight akışı graceful
# shutdown'a emanet etme" uyarısı görünür oluyor.
# Lisans: Apache-2.0 OR ISC OR MIT.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls-pemfile = "2"

# §1 §2.2 satır 400'de onaylı. Parola saklama: Argon2id, OWASP 2026 parametreleri.
# `parallel` özelliği p>1 için; varsayılan p=1 olduğundan bugün kullanılmıyor ama
# parametre matrisini değiştirmek yeniden derleme gerektirmesin diye açık.
# ⚠️ §6 §593: ARM'da NEON yok, x86'da libargon2 ile fark ölçülmedi.
# Lisans: MIT OR Apache-2.0 (AGPL uyumlu).
argon2 = { version = "0.5", features = ["std"] }

# §1 §2.2 satır 399'da onaylı. WebAuthn/FIDO2 ceremonileri.
# `danger-allow-state-serialisation`: kayıt ve doğrulama iki HTTP isteğine
# yayılıyor; aradaki challenge durumu sunucu tarafında saklanmak zorunda.
# ⚠️ §5 §3535: webauthn-rs, ldap3_proto ve concread aynı ekipten — korele risk.
# Lisans: MPL-2.0 (AGPL uyumlu).
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

# CIMD dokümanlarını çekerken sunucu sertifikasını doğrulamak için kök depo.
# Sistem deposu yerine sabit bir küme: kabın içinde ca-certificates olup
# olmadığına bağlı bir güven zinciri, sessizce farklı davranan bir dağıtım
# üretir. Lisans: MPL-2.0 (AGPL uyumlu, zayıf copyleft, dosya bazlı).
webpki-roots = "1"

# hyper'ın kendi yardımcıları: TLS akışını hyper'a bağlamak ve tower servisini
# hyper servisine çevirmek için. axum zaten hyper üstünde.
# Lisans: MIT.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }

# §1 §2.2 yığını. `argus-http` dışındaki hiçbir crate bunları görmez;
# `argus-core` özellikle görmez (karar #15).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "form", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }

# §1 §2.2 kararı. Derleme zamanı sorgu doğrulaması (`query!` makrosu) KULLANILMIYOR:
# canlı bir `DATABASE_URL` olmadan derlenemez ve derlemeyi ortama bağımlı kılar.
# Sorgular çalışma zamanında bağlanıyor; doğrulamayı gerçek veritabanına karşı
# koşan testler yapıyor.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid", "chrono", "json", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
